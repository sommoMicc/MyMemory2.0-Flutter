name: mymemory
description: Gioco del memory per Android, iOS e web.
publish_to: none
version: 3.0.0+30012
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  bluetooth_low_energy: ^6.2.1
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  app_links: ^7.2.2
  url_launcher: ^6.3.3
  audioplayers: ^6.8.1
  google_sign_in: ^7.2.0
  google_sign_in_web: ^1.1.3
  sign_in_with_apple: ^8.2.0
  google_sign_in_platform_interface: ^3.1.0
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/account/
    - assets/audio/game_feedback.wav
    - assets/audio/NOTICE.txt
    - assets/decks/
    - assets/decks/garden/
    - assets/decks/cosmos/
    - assets/decks/ocean/
    - assets/decks/food/
    - assets/decks/sports/
    - assets/decks/travel/
    - assets/decks/farm/
    - assets/decks/flora/
    - assets/decks/insects/
    - assets/decks/dinosaurs/
    - assets/decks/beach/
    - assets/decks/navigation/
    - assets/decks/pirates/
    - assets/decks/abyss/
    - assets/decks/vehicles/
    - assets/decks/professions/
    - assets/decks/instruments/
    - assets/decks/laboratory/
    - assets/decks/space_base/
    - assets/decks/aliens/
    - assets/decks/robots/
  fonts:
    - family: GoogleSignIn
      fonts:
        - asset: assets/account/GoogleSansMedium.ttf
          weight: 500
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit.ttf
