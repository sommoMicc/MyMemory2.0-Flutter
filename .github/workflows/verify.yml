name: Verify SommoMemory
on:
  push:
  workflow_dispatch:
# This public repository must not execute untrusted pull-request code on the NAS.
permissions:
  contents: read
jobs:
  server:
    runs-on: [self-hosted, Linux, X64, sommonas]
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v6
      - run: node --version && npm --version
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev
  app:
    runs-on: [self-hosted, Linux, X64, sommonas]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - run: flutter --version && java -version
      - run: flutter pub get
      - run: flutter analyze
      - run: npm ci --prefix ../server
      - run: flutter test
      - run: flutter build web --release
      - run: node ../scripts/prepare-web.mjs build/web
      - run: flutter build apk --debug
